<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 13b
        </title>
        <style>
            p {
                font-size: 14px;
                margin: 0px;
            }

            .flexbox {
                display: flex;
                flex-direction: row;
                height: 50px;
            }
            .col-1 {
                background-color: lightpink;
                width: 100px;
            }
            .col-2 {
                display: flex;
                flex-direction: column;
                width: 250px;
                background-color: lightblue;
            }
            .col-2 .row-1-box {
                display: inline-block;
                width: fit-content;
                height: fit-content;
            }
            .col-2 .row-1{
                color: black;
                background-color: transparent;
            }
            .col-2 .row-2-box {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }
            .col-2 .row-2-left,
            .col-2 .row-2-right {
                display: inline-block;
                background-color: black;
                color: white;
            }
        </style>
    </head>

    <body>
        <div class = "flexbox">
            <div class = "col-1">
            </div>
            <div class = "col-2">
                <div class = "row-1-box">
                    <p class = "row-1">
                        row1
                    </p>
                </div>
                <div class = "row-2-box">
                    <p class = "row-2-left">
                        row2
                    </p>
                    <p class = "row-2-right">
                        row2
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
