<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 15e
        </title>

        <style>
            .item-container {
                position: relative;
                width: 190px;
                height: 220px;
                border-style:dashed;
                border-color: black;
                border-width: 2px;
            }

            .item-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
            }

            .discount-overlay {
                position: absolute;
                top: -2px;
                right: -2px;
                font-family: Arial;
                color: black;
                background-color: rgb(242, 242, 242);
                padding-top: 4px;
                padding-bottom: 4px;
                padding-left: 6px;
                padding-right: 6px;
                border-bottom-left-radius: 2px;
                font-size: 10px;
                border-bottom-width: 2px;
                border-bottom-style: dashed;
                border-left-width: 2px;
                border-left-style: dashed;
                border-width: 2px;
                border-style: dashed;
                font-weight: 800;
            }
        </style>
    </head>

    <body>
        <div class = "item-container">
            <img class = "item-img" src = "images/beige-hoodie-edited.jpeg" alt = "beige-hoodie">
            <div class = "discount-overlay">
                20% OFF
            </div>
        </div>
    </body>
</html>
