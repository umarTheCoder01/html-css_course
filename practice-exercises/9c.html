<!DOCTYPE html>

<head>
    <title>
        Exercise 9c
    </title>

    <style>
        p {
            margin: 0px;
            font-family: Arial;
            font-size: 16px;
        }

        .feedback-card {
            height: 90px;
            width: 300px;
            border: solid;
            border-color: black;
            border-width: 0.25px;
        }

        .feedback-card .question,
        .feedback-card .yes-button {
            margin-left: 14px;
            margin-top: 12px;
        }

        .feedback-card .yes-button,
        .feedback-card .no-button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <html>
        <div class = "feedback-card">
            <p class = "question">
                Satisfied with our service?
            </p>

            <button class = "yes-button">
                Yes
            </button>

            <button class = "no-button">
                No
            </button>
        </div>
    </html>
</body>
