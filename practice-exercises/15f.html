<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 15e
        </title>

        <!-- ROBOTO FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <!----------------->

        <style>
            .item-container {
                position: relative;
                width: 190px;
                height: 220px;
                border-style:dashed;
                border-color: black;
                border-width: 2px;
                border-radius: 3px;
            }

            .item-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
                cursor: pointer;
                border-radius: 3px;
            }
            .item-img:hover {
                outline-style: solid;
                outline-width: 2px;
            }

            .discount-overlay {
                position: absolute;
                top: -2px;
                right: -2px;
                font-family: Arial;
                color: black;
                background-color: rgb(242, 242, 242);
                padding-top: 4px;
                padding-bottom: 4px;
                padding-left: 6px;
                padding-right: 6px;
                border-bottom-left-radius: 3px;
                font-size: 10px;
                border-bottom-width: 2px;
                border-bottom-style: dashed;
                border-left-width: 2px;
                border-left-style: dashed;
                border-width: 2px;
                border-style: dashed;
                font-weight: 800;
                cursor: default;
                border-radius: 3px;
            }
            .discount-overlay:hover {
                border-style: solid;
                border-color: black;
                border-width: 2px;
                color: white;
                background-color: black;
            }

            .add-to-cart-container {
                position: absolute;
                bottom: 0px;
                left: 0px;
                right: 0px;
                background-color: rgba(68, 68, 68, 0.369);
                height: 60px;
                display: flex;
                justify-content: center;
                align-items: center;
                border-top-width: 2px;
                border-top-style: dashed;
                margin: -2px;
                border-bottom-left-radius: 3px;;
                border-bottom-right-radius: 3px;
            }
            .add-to-cart-container:hover {
                border-top-style: solid;
                border-top-color: black;
                border-top-width: 2px;
            }

            .add-to-cart-button {
                padding-top: 4px;
                padding-bottom: 4px;
                padding-left: 7px;
                padding-right: 7px;
                border: none;
                border-radius: 3px;
                outline-width: 2.25px;
                outline-color: black;
                outline-style: solid;
                font-family: Roboto;
                font-weight: 500;
                background-color: rgba(255, 255, 255, 0.6);
                cursor: pointer;
                transition: all 0.15s;
            }
            .add-to-cart-button:hover {
                color: white;
                background-color: black;
                border-radius: 3px;
            }
        </style>
    </head>

    <body>
        <div class = "item-container">
            <img class = "item-img" src = "images/beige-hoodie-edited.jpeg" alt = "beige-hoodie">
            <div class = "discount-overlay">
                20% OFF
            </div>
            <div class = "add-to-cart-container">
                <button class = "add-to-cart-button">
                    Add to Cart
                </button>
            </div>
        </div>
    </body>
</html>
