<!-- Bootstrap -->

<!-- CSS -->
<style>
  .get-started-button {
    background-color: rgb(121, 82, 179);
    color: white;
    height: 34px;
    width: 108px;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
  }
  .download-button {
    background-color: white;
    color: rgb(108, 117, 125);
    height: 34px;
    width: 108px;
    border-radius: 4px;
    border-style: solid;
    font-weight: bold;
    cursor: pointer;
    /* NOTE: If you want a border-shaped (negative colored) button, do NOT use the "border" property in CSS! */
    /* Why? -> This is because, the "border" property was previously used to make the border NON-existent by applying the value "none" */
  }
</style>
  
<!-- HTML -->
<!-- "Get started" Button -->
<button class = "get-started-button">
  Get started
</button>
<!-- "Download" Button -->
<button class = "download-button">
  Download
</button>
