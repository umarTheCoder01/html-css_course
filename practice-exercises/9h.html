<!DOCTYPE html>

<head>
  <title>
    Exercise 8c
  </title>

  <style>

    .google-logo {
      width: 300px;
      margin-top: 270px;
      margin-bottom: 8px;
    }

    .search-bar {
      width: 600px;
      border: none;
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 15px;
      border-radius: 50px;
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
      font-size: 16px;
      margin-bottom: 28px;
    }
    .search-bar:focus {
      outline: none;
      border: solid;
      border-width: 0.1px;
      border-color: rgb(67, 175, 211);
    }

    .google-search-button,
    .feeling-lucky-button {
        border: none;
        padding-left: 18px;
        padding-right: 18px;
        padding-top: 10px;
        padding-bottom: 10px;
        margin-right: 8px;
        cursor: pointer;
        transition: background-color 0.15s;
        display: inline-block;
    }

    .google-search-button:hover,
    .feeling-lucky-button:hover {
        background-color: rgba(229, 225, 225, 0.705);
    }

    /* Aligning <div> containers to Center */
    .google-logo-container,
    .search-bar-container,
    .buttons-container {
        text-align: center;
    }
  </style>
</head>

<body>
  <html>
    <div class = "whole-container">
        <div class = "google-logo-container">
            <img class = "google-logo" src = "images/google-logo.png" alt = "Google Logo">
        </div>

        <div class = "search-bar-container">
            <input class = "search-bar" placeholder = "Search Google or type a URL">
        </div>

        <div class = "buttons-container">
            <button class = "google-search-button">
                Google Search
            </button>

            <button class = "feeling-lucky-button">
                I'm Feeling Lucky
            </button>
        </div>
    </div>
  </html>
</body>
