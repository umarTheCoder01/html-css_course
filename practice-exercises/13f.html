<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 13f
        </title>
        <!-- ROBOTO FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <!----------------->
        <link rel = "stylesheet" href = "styles/video.css">
        <link rel = "stylesheet" href = "styles/header.css">
        <link rel = "stylesheet" href = "styles/general.css">
        <style>
            p, a {
                font-family: roboto, arial;
                font-size: 18px;
                display: inline-block;
                margin: 0px;
            }

            .tweet-box {
                display: flex;
                flex-direction: row;
                column-gap: 8px;
                padding: 4px;
                width: fit-content;
            }

            .profile-picture-box {
                width: 60px;
                height: 60px;
            }
            .profile-picture {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                cursor: pointer;
            }

            .tweet-info-box {
                padding: 2px;
            }

            .tweet-info-box .header {
                display: inline block;
                width: fit-content;
                font-family: sans-serif, roboto, arial;
                margin-bottom: 4px;
            }
            .header .user-name {
                font-weight: 800;
                cursor: pointer;
                transition: text-decoration 0.15s;
            }
            .header .user-name:hover {
                text-decoration: underline
            }
            .header .user-tag {
                color: rgb(107, 107, 107);
                transition: text-decoration 0.15s;
                cursor: pointer;
            }
            .header .user-tag:hover {
                text-decoration: underline
            }

            .tweet-info-box .body {
                width: 400px;
                margin-bottom: 10px;
            }

            .tweet-info-box .attachment {
                display : flex;
                flex-direction : row;
                border-radius: 20px;
                border-style: solid;
                border-color: rgb(212, 212, 212);
                width: fit-content;
            }
            .attachment .preview-picture {
                background-color: rgb(212, 212, 212);
                width: 105px;
                height: 105px;
                border-radius: 18px;
                border-top-right-radius: 0px;
                border-bottom-right-radius: 0px;
                cursor: pointer;
            }
            .attachment .info {
                padding-left: 14px;
                padding-right: 14px;
            }
            .attachment .attachment-link {
                margin-top: 18px;
                color: rgb(118, 118, 118);
                margin-bottom: 4px;
                cursor: pointer;
                transition: text-decoration 0.15s;
            }
            .attachment .attachment-link:hover {
                text-decoration: underline;
            }
            .attachment .attachment-title {
                display: block;
                width: 250px;
                cursor: pointer;
                transition: text-decoration 0.15s;
            }
            .attachment .attachment-title:hover {
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <div class = "tweet-box">
            <div class = "profile-picture-box">
                <img class = "profile-picture" src = "images/cute-image.jpeg">
            </div>
            <div class = "tweet-info-box">
                <div class = "header">
                    <p class = "user-name">
                        supersimple.dev
                    </p>
                    <a class = "user-tag">
                        @SuperSimpleDev
                    </a>
                </div>
                <div class = "body">
                    <p class = "body-text">
                    What is backend web development? A complete overview. New video is up!
                    </p>
                </div>
                <div class = "attachment">
                    <div class = "preview-picture">
                    </div>
                    <div class = "info">
                        <a class = "attachment-link">
                            youtube.com
                        </a>
                        <p class = "attachment-title">
                            Backend web development - a complete overview (2021)
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
