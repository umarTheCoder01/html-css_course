<!-- LinkedIn -->

<!-- CSS -->
<style>
  .apply-button {
    background-color: rgb(10, 102, 194);
    color: white;
    height: 40px;
    width: 204px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .apply-button:hover {
    background-color: rgb(4, 87, 169);
  }

  .save-button {
    background-color: white;
    color: rgb(10, 102, 194);
    height: 40px;
    width: 84px;
    border-radius: 20px;
    border-style: solid;
    border-width: 1.3px;
    border-color: rgb(10, 102, 194);
    font-weight: bold;
    cursor: pointer;
    /* NOTE: If you want a border-shaped (negative colored) button, do NOT use the "border" property in CSS! */
    /* Why? -> This is because, the "border" property was previously used to make the border NON-existent by applying the value "none" */
    transition: background-color 0.15s, border-width 0.1s;
  }

  .save-button:hover {
    background-color: rgba(27, 132, 236, 0.15);
    border-width: 2.0px;
  }
</style>
  
<!-- HTML -->
<button class = "apply-button">
  Apply on company website
</button>
<button class = "save-button">
  Save
</button>
