<!DOCTYPE html>

<htnml>
    <head>
        <title>
            Google
        </title>

        <style>
            .search-section {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: fit-content;
                text-align: center;
                justify-content: center;
                margin: auto;
                align-items: center;
                row-gap: 6px;
            }

            .google-logo-box {
                width: 350px;
            }

            .google-logo {
                width: 100%;
                height: 100%;
            }

            .search-bar-box {
                width: 500px;
                height: fit-content;
                margin-top: 5px;
                margin-bottom: 10px;
            }

            .search-bar {
                width: 100%;
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 9px;
                padding-bottom: 9px;
                border: none;
                border-radius: 20px;
                box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.15);
            }

            .search-bar:focus {
                outline-style: solid;
                outline-width: 1px;
                outline-color: rgba(2, 91, 163, 0.815);
                box-shadow: inset 0px 0px 2px rgb(59, 147, 219);
            }

            .google-search-button,
            .feeling-lucky-button {
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
                border: none;
                color: rgb(36, 36, 36);
                cursor: pointer;
            }

            .google-search-button {
                margin-right: 2px;
            }
            
        </style>
    </head>

    <body>
        <div class = "search-section">
            <div class = "google-logo-box">
                <img class = "google-logo" src = "../images/google-logo.png">
            </div>
            <div class = "search-bar-box">
                <input class = "search-bar" type = "input" placeholder = "Search Google or type a URL">
            </div>
            <div class = "buttons-container">
                <button class = "google-search-button">
                    Google Search
                </button>
                <button class = "feeling-lucky-button">
                    I'm Feeling Lucky
                </button>
            </div>
        </div>
    </body>
</htnml>
