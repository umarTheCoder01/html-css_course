<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 15a
        </title>

        <style>
            .close-button {
                display: flex;
                font-family: Arial;
                position: absolute;
                top: 10px;
                right: 10px;
                width: 35px;
                height: 35px;
                color: white;
                background-color: black;
                border-radius: 50%;
                font-size: 16px;
                justify-content: space-around;
                align-items: center;
                cursor: pointer;
                transition: color 0.25s, background-color 0.25s;
            }
            .close-button:hover {
                color: rgb(219, 219, 219);
                background-color: rgb(38, 38, 38);
            }
        </style>
    </head>

    <body>
        <div class = "close-button">
            X
        </div>
    </body>
</html>
