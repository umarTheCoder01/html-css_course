<!-- 3D CLICK -->

<style>

.shadow-button {
  background-color: green;
  color: white;
  border: none;
  padding-left: 16px;
  padding-right: 16px;
  padding-top: 9.5px;
  padding-bottom: 9.5px;
  box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.2)
}

.shadow-button:hover {
  cursor: pointer;
}

.shadow-button:active {
  box-shadow: none;
  margin-left: 2px;
  margin-top: 2px;
}
</style>

<html>

<button class = "shadow-button">
  Shadow
</button>

</html>
