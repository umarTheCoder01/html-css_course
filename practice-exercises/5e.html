<!-- APPLE MACBOOK -->

<style>
  p {
    font-family: Arial;
    margin: 0px;
    font-size: 12px;
  }

  .new-message {
    color: rgb(233, 159, 23);
    font-size: 8px;
    text-align: center;
    font-weight: bold;
  }

  .product-name {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
  }

  .tag-line {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
  }

  .price-range {
    color: grey;
    text-align: center;
    margin-bottom: 9px;
  }

  .buy-button {
    color: white;
    background-color: rgb(33, 108, 220);
    border: none;
    border-radius: 16px;
    padding-left: 10px;
    padding-right: 10px;
    padding-top: 4px;
    padding-bottom: 4px;
    text-align: center;
    font-size: 11px;
    cursor: pointer;
    transition: background-color 0.20s;
  }

  .buy-button:hover {
    background-color: rgb(11, 87, 202);
  }
</style>

<html>
  <p class = "new-message">
    New
  </p>

  <p class = "product-name">
    MacBook Pro
  </p>

  <p class = "tag-line">
    Supercharged for pros.
  </p>

  <p class = "price-range">
    From $1999
  </p>

  <div style = "text-align: center;">
    <button class = "buy-button">
      Buy
    </button>
  </div>
</html>
