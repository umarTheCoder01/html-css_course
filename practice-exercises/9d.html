<!DOCTYPE html>

<head>
    <title>
        Exercise 9d
    </title>

    <style>
        p {
            margin: 0px;
            font-family: Arial;
            color: rgba(255, 255, 255, 0.95);
        }

        .install-prompt {
            height: 110px;
            width: 390px;
            background-color: rgb(39, 38, 38);
            border-radius: 26px;
            cursor: pointer;
            transition: background-color 0.20s;
        }

        .install-prompt:hover {
            background-color: rgba(39, 38, 38, 0.960);
        }
        
        .install-prompt .title {
            font-weight: bold;
            font-size: 20px;
            padding-top: 16px;
        }
        
        .install-prompt .title,
        .install-prompt .description {
            padding-left: 16px;
        }

        .install-prompt .description {
            padding-top: 12px;
            color: rgb(168, 167, 167);
        }
    </style>
</head>

<body>
    <html>
        <div class = "install-prompt">

            <p class = "title">
                Install YouTube Music
            </p>

            <p class = "description">
                Add YouTube Music to your desktop for quick and easy access
            </p>

        </div>
    </html>
</body>
