<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 12g
        </title>
        <!-- ROBOTO FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <!----------------->
        <style>
            p {
                margin: 0px;
            }

            .follow-suggestions-box {
                display: flex;
                flex-direction: column;
                row-gap: 14px;
            }

            .follow-suggestion {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 250px;
                column-gap: 12px;
            }

            .profile-picture-box {
                display: inline-block;
                width: 40px;
                height: 40px;
            }
            .profile-picture {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
                border-radius: 50%;
                cursor: pointer;
            }

            .profile-info {
                display: inline-block;
                flex: 1;
                max-width: 200px;
                font-family: Roboto, Arial;
                font-size: 12px;
            }
            .profile-name {
                font-weight: bold;
                cursor: pointer;
                text-decoration: none;
                transition: text-decoration 0.15s;
            }
            .profile-name:hover {
                text-decoration: underline;
            }
            .profile-name:visited {
                color: initial;
            }

            .profile-desc,
            .profile-popularity {
                color: rgb(152, 152, 152);
                margin-top: 1.5px;
            }
            .profile-popularity {
                font-size: 10px;
            }

            .follow-button-box {
                width: fit-content;
            }
            .follow-button {
                font-family: Roboto, Arial;
                color: rgb(255, 255, 255);
                background-color: rgb(42, 145, 242);
                border: none;
                border-radius: 4px;
                font-size: 12px;
                font-weight: 500;
                padding-left: 8px;
                padding-right: 8px;
                padding-top: 5.5px;
                padding-bottom: 5.5px;
                transition: background-color 0.15s;
                cursor: pointer;
            }
            .follow-button:hover {
                background-color: rgb(30, 126, 216);
            }
        </style>
    </head>

    <body>
        <div class = "follow-suggestions-box">
            <div class = "follow-suggestion">
                <div class = "profile-picture-box">
                    <img class = "profile-picture" src = "images/cute-image.jpeg">
                </div>
                <div class = "profile-info">
                    <a class = "profile-name" href = "">
                        Oliver
                    </a>
                    <p class = "profile-desc">
                        the cat
                    </p>
                    <p class = "profile-popularity">
                        Popular
                    </p>
                </div>
                <div class = "follow-button-box">
                    <button class = "follow-button">
                        Follow
                    </button>
                </div>
            </div>
            
            <div class = "follow-suggestion">
                <div class = "profile-picture-box">
                    <img class = "profile-picture" src = "images/cute-cat-picture.jpeg">
                </div>
                <div class = "profile-info">
                    <a class = "profile-name" href = "">
                        Mimi
                    </a>
                    <p class = "profile-desc">
                        Sleepy Cat
                    </p>
                    <p class = "profile-popularity">
                        Popular
                    </p>
                </div>
                <div class = "follow-button-box">
                    <button class = "follow-button">
                        Follow
                    </button>
                </div>
            </div>

            <div class = "follow-suggestion">
                <div class = "profile-picture-box">
                    <img class = "profile-picture" src = "images/cute-dog-picture.jpg">
                </div>
                <div class = "profile-info">
                    <a class = "profile-name" href = "">
                        Rex
                    </a>
                    <p class = "profile-desc">
                        Happy Bulldog
                    </p>
                    <p class = "profile-popularity">
                        Popular
                    </p>
                </div>
                <div class = "follow-button-box">
                    <button class = "follow-button">
                        Follow
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
