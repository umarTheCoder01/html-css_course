<!DOCTYPE html>

<head>
  <style>
    p {
      font-size: 12px;
      margin: 0px;
      font-family: Arial;
    }

    button {
      font-size: 12px;
      margin: 0px;
      font-family: Arial;
    }

    .email-heading {
      color: rgb(97, 96, 96);
      margin-bottom: 6px;
    }

    .email-input-box {
      width: 295px;
      border-width: 1.25px;
      border-style: solid;
      border-radius: 2px;
      height: 18px;
      border-color: black;
      margin-bottom: 12px;
    }

    .privacy-message {
      color:rgb(97, 96, 96);
      margin-bottom: 12px;
    }

    .agree-and-join-button {
      background-color: rgb(0, 106, 206);
      color: white;
      border: none;
      height: 36px;
      width: 300px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.5s;
    }
    .agree-and-join-button:hover {
      background-color: rgb(16, 100, 179);;
    }
  </style>
</head>

<body>
  <html>
    <p class = "email-heading">
      Email
    </p>

    <input class = "email-input-box" type="email">

    <p class = "privacy-message">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>

    <div class = "agree-and-join-button-line">
      <button class = "agree-and-join-button">
        Agree & Join
      </button>
    </div>
  </html>
</body>
