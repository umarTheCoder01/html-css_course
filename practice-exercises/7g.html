<!DOCTYPE html>

<head>
  <style>
    p {
      font-family: Arial;
      font-size: 14px;
      margin: 0px;
    }

    button {
      font-family: Arial;
      font-size: 14px;
      margin: 0px;
    }

    input {
      font-family: Arial;
      font-size: 14px;
      margin: 0px;
    }

    .cute-image {
      width: 40px;
      border-radius: 20px;
      vertical-align: middle;
      cursor: pointer;
    }

    .what-is-happening-box {
      border: none;
      vertical-align: middle;
      width: 210px;
      padding-top: 6px;
      padding-bottom: 6px;
      padding-left: 8px;
      border-radius: 15px;
      margin-left: 4px;
      margin-right: 4px;
      transition: box-shadow 0.2s;
    }
    .what-is-happening-box:hover {
      outline: none;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
    .what-is-happening-box:focus {
      outline: none;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
    }

    .tweet-button {
      background-color: rgb(22, 153, 229);
      border: none;
      color: white;
      padding-left: 12px;
      padding-right: 12px;
      padding-top: 6px;
      padding-bottom: 6px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.25s;
    }
    .tweet-button:hover {
      background-color:rgb(11, 134, 205)
    }
  </style>
</head>

<body>
  <html>
    <img class="cute-image" src="images/cute-image.jpeg">

    <input class="what-is-happening-box" placeholder="What's happening?">

    <button class="tweet-button">
      Tweet
    </button>
  </html>
</body>
