<!DOCTYPE html>

<head>
  <title>
    Exercise 8c

  <style>
    .google-logo {
      width: 300px;
      margin-top: 200px;
      margin-left: 540px;

    .search-bar {
      width: 500px;
      margin-left: 450px;

      padding-bottom: 10px;

<body>
  <html>
    <img class = "google-logo" src = "images/google-logo.png" alt = "Google Logo">

    <input class = "search-bar" placeholder = "Search Google or type a URL">
