<!-- FONT = ARIAL -->

<style>
  p {
    font-family: Arial;
    margin: 0px;
    font-size: 12px;
    text-align: center;
  }

  .shopping-message {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .learn-more-link{

    color: rgb(4, 101, 187);
  }
