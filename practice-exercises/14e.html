<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 14e
        </title>

        <!-- ROBOTO FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <!----------------->

        <style>
            p {
                margin: 0px;
            }
            .header {
                position: fixed;
                top: 0px;
                left: 0px;
                right: 0px;
                height: 40px;
            }

            .header-content {
                display: flex;
                margin: auto;
                width: 90%;
                height: 100%;
                justify-content: space-between;
                align-items: center;
                flex: 1;
                min-width: fit-content;
            }

            .left-side {
                display: flex;
                align-items: center;
                column-gap: 8px;
            }

            .profile-picture-container {
                display: inline-block;
                height: 35px;
                width: 35px;
                object-fit: cover;
                object-position: center;
                cursor: pointer;
            }

            .profile-picture {
                width: 100%;
                height: 100%;
                border-radius: 50%;
            }
            
            .profile-name {
                display: inline-block;
                font-size: 14.5px;
                font-weight: bold;
                font-family: Roboto, Arial;
                cursor: pointer;
            }
            .profile-name:hover {
                text-decoration: underline 2.5px;
            }

            .add-friend-button,
            .message-button {
                border: none;
                border-radius: 5px;
                width: 100px;
                height: 35px;
                font-weight: 500;
                font-family: Roboto;
                scale: 80%;
                font-size: 15px;
                cursor: pointer;
            }
            
            .add-friend-button {
                color: rgb(241, 241, 241);
                background-color: rgb(44, 135, 221);
                margin-right: -18px;
            }

            .message-button {
                font-family: Arial;
                color: rgb(0, 0, 0);
                background-color: rgb(235, 235, 235);
                font-weight: 800;
            }
        </style>
    </head>

    <body>
        <div class = "header">
            <div class = "header-content">
                <div class = "left-side">
                    <div class = "profile-picture-container">
                        <img src = "images/cute-image.jpeg" class = "profile-picture">
                    </div>
                    <p class = "profile-name">
                        Oliver Cat
                    </p>
                </div>
                <div class = "right-side">
                    <button class = "add-friend-button">
                        Add Friend
                    </button>
                    <button class = "message-button">
                        Message
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
