<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 14d
        </title>
        <style>
            p {
                margin: 0px;
            }
            body {
                margin: 0px;
            }
            .sidebar {
                position: fixed;
                background-color: green;
                width: 100px;
                top: 0px;
                bottom: 0px;
                right: 0px;
            }
            .text {
                color: white;
            }

            .overlay-container {
                position: fixed;
                height: 100vh;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.4);
            }

            .modal-container {
                display: flex;
                height: 100vh;
                width: 100%;
                justify-content: center;
                align-items: center;
            }
            .modal-box {
                background-color: white;
                border-radius: 6px;
                height: 125px;
                width: 350px;
                position: fixed;
                display: flex;
                flex-direction: column;
                row-gap: 12px;
            }
            .modal-title {
                font-weight: 800;
                font-family: Arial;
                font-size: 22px;
                margin-top: 13px;
            }
            .modal-title,
            .modal-description,
            .close-button {
                margin-left: 13px;
            }
            .close-button {
                height: 24px;
                width: 55px;
                border: none;
                border-radius: 4px;
                box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.25);
                cursor: pointer;
                background-color: rgb(250, 250, 250);
                font-family: monospace;
            }
        </style>
    </head>

    <body>
        <div class = "sidebar">
            <p class = "text">
                right sidebar
            </p>
        </div>
         
        <div class = "overlay-container">
        </div>

        <div class = "modal-container">
            <div class = "modal-box">
                <p class = "modal-title">
                    Modal Title
                </p>
                <p class = "modal-description">
                    This is Modal.
                </p>
                <button class = "close-button">
                    Close
                </button>
            </div>
        </div>
    </body>
</html>
