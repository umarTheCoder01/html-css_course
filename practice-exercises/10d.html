<!DOCTYPE html>

<head>
    <title>
        Exercise 10d
    </title>

    <!-- ROBOTO FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!----------------->

    <style>
        p {
            margin: 0px;
            font-family: Arial;
            font-size: 12px;
        }

        button {
            font-family: Roboto;
        }

        .friend-suggestion-card {
            display: inline-block;
            width: 130px;
            height: 213px;
            border: none;
            box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.35);
            vertical-align: middle;
            margin-left: 10px;
        }

        .profile-picture-box {
            width: 130px;
            height: 125px;
            margin-bottom: 8px;
        }

        .profile-picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: middle;
            cursor: pointer;
        }

        .card-details-box {
            padding-left: 6px;
        }

        .friend-name {
            font-weight: bold;
            margin-bottom: 3px;
            cursor: pointer;
            width: fit-content;
        }

        .friend-name:hover {
            text-decoration: underline;
        }

        .mutual-friend-picture-box {
            width: 22.5px;
            height: 22.5px;
            display: inline-block;
            vertical-align: middle;
        }

        .mutual-friend-picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            cursor: pointer;
        }

        .mutual-friends-number-box {
            display: inline-block;
            vertical-align: middle;
        }

        .mutual-friends-number {
            color: rgb(140, 140, 140);
            font-size: 10.5px;
            cursor: pointer;
        }

        .mutual-friends-number:hover {
            text-decoration: underline;
        }

        .add-friend-button {
            font-size: 11px;
            margin-top: 7px;
            border: none;
            color: rgba(255, 255, 255, 0.885);
            background-color: rgb(40, 130, 239);
            border-radius: 2px;
            padding-left: 14px;
            padding-right: 14px;
            padding-top: 5.5px;
            padding-bottom: 5.5px;
            transition: background-color 0.15s;
            cursor: pointer;
        }

        .add-friend-button:hover {
            background-color: rgba(26, 116, 226, 0.953);
        }
    </style>
</head>

<body>
    <html>
        <div class = "friend-suggestion-card">
            <div class = "profile-picture-box">
                <img class = "profile-picture" src = "images/cute-image.jpeg">
            </div>
            <div class = "card-details-box">
                <p class = "friend-name">
                    Oliver
                </p>
                <div class = "mutual-friend-picture-box">
                    <img class = "mutual-friend-picture" src = "images/mutual-friend.jpeg">
                </div>
                <div class = "mutual-friends-number-box">
                    <p class = "mutual-friends-number">
                        2 mutual friends
                    </p>
                </div>
                <button class = "add-friend-button">
                    Add Friend
                </button>
            </div>
        </div>
        <div class = "friend-suggestion-card">
            <div class = "profile-picture-box">
                <img class = "profile-picture" src = "images/cute-cat-picture.jpeg" alt = "profile-picture">
            </div>
            <div class = "card-details-box">
                <div class = "friend-name-box">
                    <p class = "friend-name">
                        Mimi
                    </p>
                </div>
                <div class = "mutual-friends-box">
                    <div class = "mutual-friend-picture-box">
                        <img class = "mutual-friend-picture" src = "images/mutual-friend.jpeg" alt = "-">
                    </div>
                    <div class = "mutual-friends-number-box">
                        <p class = "mutual-friends-number">
                            3 mutual friends
                        </p>
                    </div>
                </div>
                <div class = "add-friend-button-box">
                    <button class = "add-friend-button">
                        Add Friend
                    </button>
                </div>
            </div>
        </div>
        <div class = "friend-suggestion-card">
            <div class = "profile-picture-box">
                <img class = "profile-picture" src = "images/cute-dog-picture.jpg" alt = "profile-picture">
            </div>
            <div class = "card-details-box">
                <div class = "friend-name-box">
                    <p class = "friend-name">
                        Rex
                    </p>
                </div>
                <div class = "mutual-friends-box">
                    <div class = "mutual-friend-picture-box">
                        <img class = "mutual-friend-picture" src = "images/mutual-friend.jpeg" alt = "-">
                    </div>
                    <div class = "mutual-friends-number-box">
                        <p class = "mutual-friends-number">
                            4 mutual friends
                        </p>
                    </div>
                </div>
                <div class = "add-friend-button-box">
                    <button class = "add-friend-button">
                        Add Friend
                    </button>
                </div>
            </div>
        </div>
    </html>
</body>
