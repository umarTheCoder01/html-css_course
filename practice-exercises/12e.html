<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 12e
        </title>
        <!-- ROBOTO FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <!----------------->
        <style>
            p {
                font-family: Roboto, Arial;
                margin: 0;
            }

            .nav-bar {
                display: flex;
                flex-direction: column;
                border-radius: 6px;
                border: none;
                box-shadow: 0px 0px 2.5px rgba(0, 0, 0, 0.3);
                padding-left: 12px;
                padding-top: 10px;
                padding-right: 10px;
                padding-bottom: 10px;
                width: 290px;
                row-gap: 15px;
            }

            .action-row {
                display: inline-block;
            }
            .action {
                display: inline-block;
                width: 250px;
            }
            
            .new-activity-number {
                display: inline-block;
                width: fit-content;
                font-weight: 800;
                font-size: 12px;
                background-color: rgb(13, 116, 226);
                color: white;
                padding-top: 3.5px;
                padding-bottom: 3.5px;
                padding-left: 9.5px;
                padding-right: 9.5px;
                border-radius: 15px;
            }
        </style>
    </head>
    <body>
        <div class = "nav-bar">
            <div class = "action-row">
                <p class = "action">
                    Home
                </p>
                <p class = "new-activity-number">
                    14
                </p>
            </div>
            <div class = "action-row">
                <p class = "action">
                    Notifications
                </p>
                <p class = "new-activity-number">
                    3
                </p>
            </div>
            <div class = "action-row">
                <p class = "action">
                    Messages
                </p>
                <p class = "new-activity-number">
                    5
                </p>
            </div>
        </div>
    </body>
</html>
