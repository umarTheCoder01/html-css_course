<!DOCTYPE html>

<html>
    <head>
        <title>
            Exercise 12f
        </title>
        <style>
            body {
                font-family: Arial;
                font-size: 12px;;
            }

            .header {
                display: flex;
                flex-direction: row;
                background-color: rgb(121, 68, 181);
                justify-content: space-between;
                align-items: center;
                height: 50px;;
            }

            .header .left-side {
                display: inline-block;
                width: 125px;
                padding-left: 12px;
            }
            .home-link {
                color: white;
                font-size: 14px;
                text-decoration: none;
                font-weight: bold;
                cursor: pointer;
                transition: text-decoration 0.15s;
            }
            .home-link:hover {
                text-decoration: underline;
            }

            .header .right-side {
                width: 175px;
                text-align: end;
                padding-right: 8px;
            }
            .download-button {
                border-style: solid;
                background-color: inherit;
                color: white;
                border-radius: 4px;
                border-color: white;
                padding-left: 12px;
                padding-right: 12px;
                padding-top: 6px;
                padding-bottom: 6px;
                border-width: 1px;
                cursor: pointer;
                transition: background-color 0.15s;
            }
            .download-button:hover {
                background-color: rgb(129, 76, 190);
            }

            .header .middle {
                flex: 1;
                max-width: 700px;
            }
            .search-bar {
                background-color: white;
                color: rgba(154, 154, 154, 0.89);
                padding-left: 18px;
                padding-right: 18px;
                padding-top: 6px;
                padding-bottom: 6px;
                border: none;
                border-radius: 15px;
                width: 100%;
                transition: outline-color 0.30s;
            }
            .search-bar:focus {
                outline-style: solid;
                outline-width: 1px;
                outline-color: white;
            }
        </style>
    </head>

    <body>
        <div class = "header">
            <div class = "left-side">
                <a class = "home-link" href = "">
                    Home
                </a>
            </div>
            <div class = "middle">
                <input class = "search-bar" type = "search" placeholder = "Search">
            </div>
            <div class = "right-side">
                <button class = "download-button">
                    Download
                </button>
            </div>
        </div>
    </body>
</html>
