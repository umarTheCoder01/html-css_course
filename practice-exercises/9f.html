<!DOCTYPE html>

<head>
    <title>
        Exercise 9f
    </title>

    <style>
        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            margin: 0px;
        }

        .profile-card {
            margin-left: 20px;
            margin-top: 20px;
            height: 225px;
            width: 140px;
            box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.25);
        }
        
        .profile-picture {
            width: 140px;
            margin-bottom: 5px;
        }

        .profile-name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 1px;
        }

        .mutual-friends {
            color: rgba(0, 0, 0, 0.55);
            margin-bottom: 8px;
        }

        .add-friend-button {
            margin-left: 5px;
            border: none;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 7px;
            padding-bottom: 7px;
            border-radius: 4px;
            background-color: rgb(29, 132, 216);
            color: white;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .add-friend-button:hover {
            background-color: rgba(30, 129, 210, 0.874);
        }

        .profile-name,
        .mutual-friends {
            padding-left: 5px;
        }

    </style>
</head>

<body>
    <html>
        <div class = "profile-card">
            <img src = "images/cute-image.jpeg" class = "profile-picture">

            <p class = "profile-name">
                Oliver
            </p>

            <p class = "mutual-friends">
                2 mutual friends
            </p>

            <button class = "add-friend-button">
                Add Friend
            </button>
        </div>
    </html>
</body>
